name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, cursor/v134-nov7-feedback-449a, cursor/v135-ui-pdf-fixes-49bc, cursor/modularity-0-2-f97a]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
